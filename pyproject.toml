[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "free-crypto-trading-bot"   # the importable package and the short command stay trend4h
dynamic = ["version"]
description = "Free crypto trading bot by BYTtrade: four backtested 4h trend-following strategies, open backtest, web panel, 11 exchanges"
readme = "README.md"
license = "LicenseRef-BYTtrade-Source-Available-1.3"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "BYTtrade" }]
keywords = ["crypto", "trading bot", "cryptocurrency", "futures", "perpetuals", "trend following", "backtest",
            "algorithmic trading", "binance", "bybit", "okx", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.22", "pandas>=1.5"]

[project.urls]
Homepage = "https://byttrade.com/?utm_source=github&utm_medium=free_tool&utm_campaign=free-crypto-trading-bot&utm_content=pypi"
Repository = "https://github.com/byttrade/free-crypto-trading-bot"
Documentation = "https://github.com/byttrade/free-crypto-trading-bot/blob/main/docs/guide.md"
Issues = "https://github.com/byttrade/free-crypto-trading-bot/issues"
Changelog = "https://github.com/byttrade/free-crypto-trading-bot/blob/main/CHANGELOG.md"

[project.scripts]
free-crypto-trading-bot = "trend4h.__main__:main"
trend4h = "trend4h.__main__:main"

[project.optional-dependencies]
live = ["bytx>=0.2.2,<0.3"]  # <0.3: a breaking bytx needs a release of this project first
agent = ["mcp>=1.2"]                 # only for the `mcp` command
all = ["bytx>=0.2.2,<0.3", "mcp>=1.2"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["trend4h"]

[tool.setuptools.package-data]
trend4h = ["specs/*.json"]

[tool.setuptools.dynamic]
version = { attr = "trend4h.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
