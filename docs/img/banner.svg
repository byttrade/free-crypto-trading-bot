<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Free Crypto Trading Bot by BYTtrade — 4h trend-following strategies for crypto futures">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b0f542" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b0f542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0f542" stop-opacity=".22"/>
      <stop offset="1" stop-color="#b0f542" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre; }
    .trend { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 4.5s ease-out infinite; }
    .area { opacity: 0; animation: fade 4.5s ease-out infinite; }
    .tip { opacity: 0; animation: tip 4.5s ease-out infinite; }
    .row { opacity: 0; animation: row 9s ease-in-out infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; }
    .live { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 420; } 70%, 100% { stroke-dashoffset: 0; } }
    @keyframes fade { 0%, 40% { opacity: 0; } 75%, 100% { opacity: 1; } }
    @keyframes tip { 0%, 65% { opacity: 0; } 72%, 100% { opacity: 1; } }
    @keyframes row { 0%, 4% { opacity: 0; transform: translateY(8px); } 10%, 30% { opacity: 1; transform: none; } 36%, 100% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .trend, .area, .tip, .row, .live { animation: none; opacity: 1; stroke-dashoffset: 0; } .r2, .r3 { opacity: 0; } }
  </style>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- 4h-свечи и линия тренда -->
  <circle cx="170" cy="160" r="140" fill="url(#glow)"/>
  <g stroke="#b0f542" stroke-opacity=".12"><path d="M40 70h270M40 130h270M40 190h270M40 250h270"/></g>
  <g stroke-width="2">
    <g stroke="#f31260" fill="#f31260"><path d="M62 206v34"/><rect x="56" y="212" width="12" height="20" rx="2"/></g>
    <g stroke="#17c964" fill="#17c964"><path d="M88 196v38"/><rect x="82" y="204" width="12" height="22" rx="2"/></g>
    <g stroke="#17c964" fill="#17c964"><path d="M114 176v40"/><rect x="108" y="184" width="12" height="24" rx="2"/></g>
    <g stroke="#f31260" fill="#f31260"><path d="M140 180v32"/><rect x="134" y="186" width="12" height="18" rx="2"/></g>
    <g stroke="#17c964" fill="#17c964"><path d="M166 150v44"/><rect x="160" y="158" width="12" height="28" rx="2"/></g>
    <g stroke="#17c964" fill="#17c964"><path d="M192 128v38"/><rect x="186" y="136" width="12" height="24" rx="2"/></g>
    <g stroke="#f31260" fill="#f31260"><path d="M218 132v30"/><rect x="212" y="138" width="12" height="16" rx="2"/></g>
    <g stroke="#17c964" fill="#17c964"><path d="M244 104v42"/><rect x="238" y="112" width="12" height="26" rx="2"/></g>
    <g stroke="#17c964" fill="#17c964"><path d="M270 80v40"/><rect x="264" y="88" width="12" height="24" rx="2"/></g>
  </g>
  <path class="area" d="M50 250 L62 238 L88 228 L114 214 L140 210 L166 192 L192 166 L218 160 L244 144 L270 118 L296 104 L296 250 Z" fill="url(#fill)"/>
  <path class="trend" d="M50 250 L62 238 L88 228 L114 214 L140 210 L166 192 L192 166 L218 160 L244 144 L270 118 L296 104" fill="none" stroke="#b0f542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="tip"><circle cx="296" cy="104" r="6" fill="#b0f542"/><circle cx="296" cy="104" r="12" fill="none" stroke="#b0f542" stroke-opacity=".4"/></g>
  <path d="M50 262h250" stroke="#f31260" stroke-width="1.5" stroke-dasharray="5 5" opacity=".7"/>
  <text x="50" y="282" class="m" font-size="12" fill="#f31260" opacity=".8">stop-loss on the exchange</text>

  <!-- название -->
  <text x="340" y="104" class="t" font-size="54" font-weight="800" fill="#ffffff">Free Crypto <tspan fill="#b0f542">Trading Bot</tspan></text>
  <text x="342" y="142" class="t" font-size="22" fill="#9aa7b4">4h trend-following strategies for crypto futures · by BYTtrade</text>
  <text x="342" y="174" class="t" font-size="17" fill="#6f7d8b">open backtest · web panel · 11 exchanges · demo first · your own AI agent · free</text>

  <!-- живая лента событий исполнителя -->
  <g transform="translate(342 206)">
    <rect width="800" height="64" rx="12" fill="#0e141b" stroke="#1f2a36"/>
    <circle class="live" cx="24" cy="32" r="6" fill="#17c964"/>
    <text x="40" y="38" class="m" font-size="15" fill="#17c964">4h</text>
    <g class="row"><text x="80" y="38" class="m" font-size="19" fill="#dfe6ee">BTC  <tspan fill="#17c964">long</tspan>   Supertrend + daily EMA50   <tspan fill="#6f7d8b">stop placed ✓</tspan></text></g>
    <g class="row r2"><text x="80" y="38" class="m" font-size="19" fill="#dfe6ee">SOL  <tspan fill="#f31260">short</tspan>  Keltner breakout + ADX     <tspan fill="#6f7d8b">stop placed ✓</tspan></text></g>
    <g class="row r3"><text x="80" y="38" class="m" font-size="19" fill="#dfe6ee">NEAR closed by take-profit   <tspan fill="#b0f542">+1.55 R</tspan>   <tspan fill="#6f7d8b">demo account</tspan></text></g>
  </g>
</svg>
