<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 262" width="962" height="262" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="962" height="262" rx="14" fill="#EDF1F0"/><rect x="24" y="34" width="200" height="118" rx="12" fill="#FBFCFC" stroke="#D2DBD8" stroke-width="1.2"/><text x="124" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#14201E">Market data</text><text x="124" y="98" text-anchor="middle" font-size="13.5" fill="#56645F">public Binance candles,</text><text x="124" y="117" text-anchor="middle" font-size="13.5" fill="#56645F">4h and 1d</text><path d="M230 93h22m-7-6l7 6-7 6" fill="none" stroke="#0E5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="34" width="200" height="118" rx="12" fill="#FBFCFC" stroke="#D2DBD8" stroke-width="1.2"/><text x="362" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#14201E">Signals</text><text x="362" y="98" text-anchor="middle" font-size="13.5" fill="#56645F">4 strategies, the same</text><text x="362" y="117" text-anchor="middle" font-size="13.5" fill="#56645F">code as the backtest</text><path d="M468 93h22m-7-6l7 6-7 6" fill="none" stroke="#0E5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="500" y="34" width="200" height="118" rx="12" fill="#FBFCFC" stroke="#0E5A63" stroke-width="2"/><text x="600" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#14201E">Executor</text><text x="600" y="98" text-anchor="middle" font-size="13.5" fill="#56645F">once per closed 4h bar:</text><text x="600" y="117" text-anchor="middle" font-size="13.5" fill="#56645F">reconcile, move stops,</text><text x="600" y="136" text-anchor="middle" font-size="13.5" fill="#56645F">open with a stop</text><path d="M706 93h22m-7-6l7 6-7 6" fill="none" stroke="#0E5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="738" y="34" width="200" height="118" rx="12" fill="#FBFCFC" stroke="#D2DBD8" stroke-width="1.2"/><text x="838" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#14201E">Your exchange</text><text x="838" y="98" text-anchor="middle" font-size="13.5" fill="#56645F">orders through the</text><text x="838" y="117" text-anchor="middle" font-size="13.5" fill="#56645F">bytx SDK, 11 exchanges</text><path d="M600 152v22" stroke="#0E5A63" stroke-width="2" stroke-dasharray="4 4"/><rect x="24" y="176" width="914" height="40" rx="10" fill="#DDEBEB"/><text x="481" y="201" text-anchor="middle" font-size="14" font-weight="600" fill="#0E5A63">You stay in control: web panel, command line, or your own AI agent with a token</text><text x="481" y="243" text-anchor="middle" font-size="13" fill="#56645F">Every position has a stop-loss on the exchange. Start on a demo account.</text></svg>
