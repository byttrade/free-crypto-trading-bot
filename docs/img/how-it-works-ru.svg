<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 262" width="962" height="262" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="962" height="262" rx="14" fill="#EDF1F0"/><rect x="24" y="34" width="200" height="118" rx="12" fill="#FBFCFC" stroke="#D2DBD8" stroke-width="1.2"/><text x="124" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#14201E">Данные рынка</text><text x="124" y="98" text-anchor="middle" font-size="13.5" fill="#56645F">публичные свечи Binance,</text><text x="124" y="117" text-anchor="middle" font-size="13.5" fill="#56645F">4h и 1d</text><path d="M230 93h22m-7-6l7 6-7 6" fill="none" stroke="#0E5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="34" width="200" height="118" rx="12" fill="#FBFCFC" stroke="#D2DBD8" stroke-width="1.2"/><text x="362" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#14201E">Сигналы</text><text x="362" y="98" text-anchor="middle" font-size="13.5" fill="#56645F">4 стратегии, тот же код,</text><text x="362" y="117" text-anchor="middle" font-size="13.5" fill="#56645F">что и в бэктесте</text><path d="M468 93h22m-7-6l7 6-7 6" fill="none" stroke="#0E5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="500" y="34" width="200" height="118" rx="12" fill="#FBFCFC" stroke="#0E5A63" stroke-width="2"/><text x="600" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#14201E">Исполнитель</text><text x="600" y="98" text-anchor="middle" font-size="13.5" fill="#56645F">раз в закрытый бар 4h:</text><text x="600" y="117" text-anchor="middle" font-size="13.5" fill="#56645F">сверка, перенос стопов,</text><text x="600" y="136" text-anchor="middle" font-size="13.5" fill="#56645F">вход со стопом</text><path d="M706 93h22m-7-6l7 6-7 6" fill="none" stroke="#0E5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="738" y="34" width="200" height="118" rx="12" fill="#FBFCFC" stroke="#D2DBD8" stroke-width="1.2"/><text x="838" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#14201E">Ваша биржа</text><text x="838" y="98" text-anchor="middle" font-size="13.5" fill="#56645F">ордера через SDK bytx,</text><text x="838" y="117" text-anchor="middle" font-size="13.5" fill="#56645F">11 бирж</text><path d="M600 152v22" stroke="#0E5A63" stroke-width="2" stroke-dasharray="4 4"/><rect x="24" y="176" width="914" height="40" rx="10" fill="#DDEBEB"/><text x="481" y="201" text-anchor="middle" font-size="14" font-weight="600" fill="#0E5A63">Управление у вас: веб-панель, командная строка или свой ИИ-агент по токену</text><text x="481" y="243" text-anchor="middle" font-size="13" fill="#56645F">У каждой позиции стоп-лосс на бирже. Начинайте с демо-счёта.</text></svg>
